<!DOCTYPE html><html lang="es-AR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truco con IA</title>
<style>
:root{--bg:#0f241b;--felt:#1f4d3a;--paper:#f4ecd8;--ink:#2b1d12;--gold:#d9a21b;--red:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--paper);font-family:system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;display:flex;flex-direction:column;gap:8px;padding:10px}
header{display:flex;justify-content:space-between;align-items:center}
.sc{text-align:center}.sc span{display:block;font-size:13px;opacity:.8}.sc b{font:700 34px Georgia,serif;color:var(--gold)}
#st{font:italic 15px Georgia,serif;text-align:center;flex:1}
#tb{background:var(--felt);border:2px solid #0b1b14;border-radius:14px;padding:10px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.row{display:flex;gap:6px;justify-content:center;min-height:84px}
#bk{display:flex;gap:4px;justify-content:center;min-height:22px;font-size:13px;opacity:.85}
#log{font-size:14px;text-align:center;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.c{width:58px;height:84px;background:var(--paper);color:var(--ink);border:0;border-radius:6px;border-left:8px solid var(--s,#999);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;padding:0}
.c b{font-size:30px;line-height:1}.c i{font-size:11px;font-style:normal}
.ph{width:58px;height:84px;border:1px dashed #ffffff33;border-radius:6px}
#hand{display:flex;gap:10px;justify-content:center}
#hand .c{width:76px;height:110px}#hand .c b{font-size:40px}#hand .c i{font-size:13px}
#hand button.c:enabled{outline:3px solid var(--gold);cursor:pointer}
#hand button.c:disabled{opacity:.85}
#act{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px}
button.a{min-height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--gold);color:var(--ink);font:700 16px system-ui}
button.a.n{background:var(--red);color:#fff}
footer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
footer select,footer button{min-height:40px;border-radius:10px;border:1px solid #ffffff44;background:#00000040;color:var(--paper);padding:0 12px;font-size:14px}
</style></head><body><main>
<header><div class="sc"><span>IA</span><b id="s1">0</b></div><div id="st">Tocá “Empezar”</div><div class="sc"><span>Vos</span><b id="s0">0</b></div></header>
<section id="tb"><div id="bk"></div><div class="row" id="r1"></div><div id="log"></div><div class="row" id="r0"></div></section>
<div id="hand"></div><div id="act"><button class="a" onclick="newGame()">Empezar</button></div>
<footer><select id="lv"><option value="1">Fácil</option><option value="2" selected>Medio</option><option value="3">Difícil</option></select>
<button id="vz">Voz: sí</button><button id="mic">🎙 Hablar</button></footer>
</main>
<script>
const SU=['O','C','E','B'],SN={O:'oro',C:'copa',E:'espada',B:'basto'},SC={O:'#d9a21b',C:'#b3261e',E:'#1b5fa8',B:'#2e7d32'},NUMS=[1,2,3,4,5,6,7,10,11,12];
const NAMES=['','¡Truco!','¡Retruco!','¡Vale cuatro!'],TL=['Truco','Retruco','Vale cuatro'],EN={envido:'¡Envido!',real:'¡Real envido!',falta:'¡Falta envido!'},EP={envido:2,real:3};
const $=id=>document.getElementById(id);
let score=[0,0],mano=1,G=null,voice=true,logs=[];
const lvl=()=>+$('lv').value;
function rank(c){const{n,s}=c;if(n==1&&s=='E')return 14;if(n==1&&s=='B')return 13;if(n==7&&s=='E')return 12;if(n==7&&s=='O')return 11;if(n==3)return 10;if(n==2)return 9;if(n==1)return 8;if(n==12)return 7;if(n==11)return 6;if(n==10)return 5;if(n==7)return 4;if(n==6)return 3;if(n==5)return 2;return 1}
const ev=c=>c.n>=10?0:c.n;
function envido(h){let b=Math.max(...h.map(ev));for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(h[i].s==h[j].s)b=Math.max(b,20+ev(h[i])+ev(h[j]));return b}
const flor=h=>h[0].s==h[1].s&&h[1].s==h[2].s;
function hw(r,m){const[a,b,c]=r;if(r.length<2)return null;if(a!=-1&&a==b)return a;if(a==-1&&b!=-1)return b;if(a!=-1&&b==-1)return a;if(r.length<3)return null;if(c!=-1)return c;return a!=-1?a:m}
function log(p,t){logs.push((p==1?'IA: ':p==0?'Vos: ':'')+t);logs=logs.slice(-3)}
function say(p,t){log(p,t);if(p==1&&voice&&'speechSynthesis' in window){const u=new SpeechSynthesisUtterance(t.replace(/[¡!]/g,''));u.lang='es-AR';const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang.replace('_','-')=='es-AR')||vs.find(x=>x.lang.startsWith('es'));if(v)u.voice=v;u.rate=1.05;u.pitch=1.1;speechSynthesis.speak(u)}}
function newGame(){score=[0,0];mano=1;logs=[];newHand()}
function newHand(){mano=1-mano;const d=[];SU.forEach(s=>NUMS.forEach(n=>d.push({n,s})));
for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
const h=[d.slice(0,3),d.slice(3,6)];
G={h,orig:h.map(x=>x.slice()),table:[[],[]],res:[],mano,turn:mano,truco:0,canRaise:null,env:false,pend:null,stash:null,over:false};
const f=h.map(flor);if(f[0]||f[1]){G.env=true;f.forEach((x,p)=>{if(x){score[p]+=3;say(p,'¡Flor! Tres puntos')}})}
if(chk())return;next()}
function chk(){if(score[0]>=15||score[1]>=15){G.over=true;G.turn=-1;log(-1,score[0]>=15?'¡Ganaste la partida!':'Ganó la IA la partida');render();return true}return false}
function next(){render();if(G.over)return;setTimeout(()=>{if(G.over)return;if(G.pend&&G.pend.by==0)aiRespond();else if(!G.pend&&G.turn==1)aiAct()},900)}
function endHand(w,pts){G.turn=-1;G.pend=null;score[w]+=pts;log(-1,(w==0?'Ganás ':'Gana la IA ')+pts+(pts>1?' puntos':' punto'));if(chk())return;render();setTimeout(newHand,2200)}
function play(p,i){const c=G.h[p].splice(i,1)[0];G.table[p].push(c);
if(G.table[0].length==G.table[1].length){const k=G.table[0].length-1,a=rank(G.table[0][k]),b=rank(G.table[1][k]),w=a>b?0:a<b?1:-1;G.res.push(w);if(w==-1)log(-1,'Parda');const h=hw(G.res,G.mano);
if(h!==null){G.turn=-1;render();setTimeout(()=>endHand(h,[1,2,3,4][G.truco]),1000);return}
G.turn=w==-1?G.mano:w}else G.turn=1-p;next()}
const canTruco=p=>!G.pend&&G.truco<3&&(G.canRaise==null||G.canRaise==p);
const envOK=()=>!G.env&&G.res.length==0&&(!G.pend||G.pend.t=='truco');
function callTruco(p){G.pend={t:'truco',by:p,lvl:G.truco+1};say(p,NAMES[G.pend.lvl]);next()}
function callEnv(p,k){if(G.pend){G.stash=G.pend}G.pend={t:'env',k,by:p};say(p,EN[k]);next()}
function finishEnv(w,pts){score[w]+=pts;G.env=true;G.pend=G.stash;G.stash=null;if(chk())return;next()}
function respond(p,a){const pd=G.pend,c=pd.by;
if(pd.t=='env'){if(a=='n'){say(p,'No quiero');finishEnv(c,1);return}
say(p,'Quiero');const e=[envido(G.orig[0]),envido(G.orig[1])],w=e[0]==e[1]?G.mano:e[0]>e[1]?0:1;
log(-1,'Envido: vos '+e[0]+', IA '+e[1]);if(voice||1)say(1,w==1?'Tengo '+e[1]:'Son buenas');
finishEnv(w,pd.k=='falta'?15-Math.max(...score):EP[pd.k]);return}
if(a=='n'){say(p,'No quiero');endHand(c,pd.lvl);return}
G.truco=pd.lvl;G.canRaise=p;G.pend=null;
if(a=='raise'){callTruco(p);return}
say(p,'Quiero');next()}
function strength(p){const hs=G.h[p];if(!hs.length)return 0;const r=hs.map(rank);const v=.5*(r.reduce((a,b)=>a+b,0)/r.length/14)+.5*(Math.max(...r)/14);
const w=G.res.filter(x=>x==p).length,l=G.res.filter(x=>x==1-p).length;return v+(w-l)*.18}
const noise=()=>(Math.random()-.5)*[0,.6,.25,.1][lvl()],bluff=()=>Math.random()<[0,.03,.08,.15][lvl()];
function aiAct(){if(G.over||G.turn!=1||G.pend)return;const v=strength(1)+noise();
if(envOK()&&G.h[1].length==3){const e=envido(G.orig[1])+Math.round(noise()*10);
if(e>=33){callEnv(1,'falta');return}if(e>=31||(bluff()&&e<24)){callEnv(1,'real');return}if(e>=27){callEnv(1,'envido');return}}
if(canTruco(1)&&(v>.78+.05*G.truco||(bluff()&&G.truco==0&&G.res.length>0))){callTruco(1);return}
const hs=G.h[1],idx=hs.map((c,i)=>i).sort((a,b)=>rank(hs[a])-rank(hs[b])),opp=G.table[0].length>G.table[1].length?G.table[0][G.table[0].length-1]:null;let pick;
if(opp){const win=idx.filter(i=>rank(hs[i])>rank(opp)),eq=idx.filter(i=>rank(hs[i])==rank(opp));pick=win.length?win[0]:eq.length?eq[0]:idx[0]}
else{pick=G.res.length==0?idx[idx.length>>1]:idx[idx.length-1];if(lvl()==3&&G.res.length==0&&Math.random()<.25)pick=idx[0]}
play(1,pick)}
function aiRespond(){const pd=G.pend;if(!pd||pd.by!=0)return;
if(pd.t=='env'){const e=envido(G.orig[1])+Math.round(noise()*8),need={envido:25,real:28,falta:30}[pd.k];respond(1,e>=need||bluff()?'q':'n');return}
const v=strength(1)+noise(),need=[0,.5,.62,.72][pd.lvl];
if(pd.lvl<3&&v>need+.18)respond(1,'raise');else respond(1,v>need||bluff()?'q':'n')}
function act(a){if(!G||G.over||G.turn<0&&!G.pend)return;
if(G.pend&&G.pend.by==1){const pd=G.pend;if(a=='q'||a=='n')return respond(0,a);
if(a=='truco'&&pd.t=='truco'&&pd.lvl<3)return respond(0,'raise');
if(['envido','real','falta'].includes(a)&&pd.t=='truco'&&envOK())return callEnv(0,a);return}
if(G.pend||G.turn!=0)return;
if(a=='truco'&&canTruco(0))return callTruco(0);
if(['envido','real','falta'].includes(a)&&envOK())return callEnv(0,a);
if(a=='mazo')return endHand(1,[1,2,3,4][G.truco])}
const cardEl=c=>`<span class="c" style="--s:${SC[c.s]}"><b>${c.n}</b><i>${SN[c.s]}</i></span>`;
function render(){$('s0').textContent=score[0];$('s1').textContent=score[1];
$('log').innerHTML=logs.map(l=>'<div>'+l+'</div>').join('');if(!G)return;
$('bk').textContent=G.over?'':'La IA tiene '+G.h[1].length+' carta'+(G.h[1].length==1?'':'s');
[0,1].forEach(p=>{$('r'+p).innerHTML=[0,1,2].map(i=>G.table[p][i]?cardEl(G.table[p][i]):'<span class="ph"></span>').join('')});
const mine=G.turn==0&&!G.pend&&!G.over;
$('hand').innerHTML=G.h[0].map((c,i)=>`<button class="c" style="--s:${SC[c.s]}" data-i="${i}" ${mine?'':'disabled'}><b>${c.n}</b><i>${SN[c.s]}</i></button>`).join('');
document.querySelectorAll('#hand button').forEach(b=>b.onclick=()=>play(0,+b.dataset.i));
$('st').textContent=G.over?'Fin de la partida':G.pend&&G.pend.by==0?'Esperando respuesta…':G.pend?'Te cantan, respondé':G.turn==0?'Tu turno':G.turn==1?'Piensa la IA…':'';
let b=[];
if(G.over)b=[['Nueva partida','new']];
else if(G.pend&&G.pend.by==1){b=[['Quiero','q'],['No quiero','n']];if(G.pend.t=='truco'&&G.pend.lvl<3)b.push([TL[G.pend.lvl],'truco']);if(G.pend.t=='truco'&&envOK())b.push(['Envido','envido'],['Real envido','real'],['Falta envido','falta'])}
else if(!G.pend&&G.turn==0){if(canTruco(0))b.push([TL[G.truco],'truco']);if(envOK())b.push(['Envido','envido'],['Real envido','real'],['Falta envido','falta']);b.push(['Mazo','mazo'])}
$('act').innerHTML=b.map(x=>`<button class="a ${x[1]=='n'||x[1]=='mazo'?'n':''}" data-a="${x[1]}">${x[0]}</button>`).join('');
document.querySelectorAll('#act button').forEach(el=>el.onclick=()=>el.dataset.a=='new'?newGame():act(el.dataset.a))}
function cmd(t){t=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');log(0,'"'+t+'"');
const m=[[/no quiero/,'n'],[/vale|retruco|truco/,'truco'],[/falta/,'falta'],[/real/,'real'],[/envido/,'envido'],[/quiero/,'q'],[/mazo|me voy/,'mazo']].find(x=>x[0].test(t));if(m)act(m[1]);else render()}
$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){log(-1,'Este navegador no tiene reconocimiento de voz, usá Chrome');render();return}
try{speechSynthesis.cancel()}catch(e){}
const r=new R();r.lang='es-AR';r.onresult=e=>cmd(e.results[0][0].transcript);r.onerror=e=>{log(-1,e.error=='not-allowed'?'Dale permiso al micrófono en Chrome':'No te escuché, probá de nuevo');render()};r.onend=()=>$('mic').textContent='🎙 Hablar';
try{r.start();$('mic').textContent='🎙 Escuchando…';}catch(e){}};
$('vz').onclick=()=>{voice=!voice;$('vz').textContent='Voz: '+(voice?'sí':'no')};
</script></body></html>
